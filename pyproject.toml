[project]
name = "scoresplit"
version = "0.2.0"
description = "Split sheet-music PDFs (score + parts) into one PDF per instrument part"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Studio Korenat", email = "info@korenat.com" }
]
keywords = ["sheet music", "pdf", "score", "parts", "ocr"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pypdfium2>=5.15.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "tesserocr==2.13.0",
    "typer>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/studiokorenat/scoresplit"
Source = "https://github.com/studiokorenat/scoresplit"
Issues = "https://github.com/studiokorenat/scoresplit/issues"

[project.scripts]
scoresplit = "scoresplit:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Lets the tests "import precision" (scripts/precision.py, the developer tool
# that scores detection against the example PDFs). scripts/ is not part of
# the installed app.
pythonpath = ["scripts"]
